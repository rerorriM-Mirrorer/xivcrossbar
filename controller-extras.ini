[Controller]
; Both root wrappers read this. Set 0 to disable either feature.
L3Enabled=1
ShouldersEnabled=1
; With one client: activate/restore it, or minimize it when already focused.
SingleClientToggle=1
; One immediate shoulder tap, then repeat after 3 seconds at 2 taps/second.
ShoulderRepeatEnabled=1
ShoulderRepeatDelayMs=3000
ShoulderRepeatIntervalMs=500
; DirectInput measurements on the tested DualSense. XInput uses native masks.
L1Joy=5
R1Joy=6
L3Joy=11
