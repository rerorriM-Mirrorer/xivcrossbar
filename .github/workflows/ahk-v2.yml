name: Native AHK v2 migration checks
on:
  push:
    branches: [development/ahk-v2-migration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        executable: [AutoHotkey64.exe, AutoHotkey32.exe]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned official AutoHotkey v2
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip' -OutFile "$env:RUNNER_TEMP\ahk.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\ahk.zip" -Algorithm SHA256).Hash -ne '4E0D0E65655066A646A210951320FEAEF0729A3597177131ADAEC4066BEF5869') { throw 'AHK archive hash mismatch' }
          Expand-Archive "$env:RUNNER_TEMP\ahk.zip" "$env:RUNNER_TEMP\ahk"
      - name: Native functions, startup, mutex, stop and bootstrap
        shell: pwsh
        run: ./tests/ahk_v2.ps1 -Interpreter "$env:RUNNER_TEMP\ahk\${{ matrix.executable }}"
      - name: Preserve native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahk-v2-native-results-${{ matrix.executable }}
          path: native-test-results
