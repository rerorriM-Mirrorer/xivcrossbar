name: Personal controller native port
on:
  push:
    branches: [development/personal-native-controller]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x86:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Win32 native guard
        shell: pwsh
        run: |
          cmake -S native -B "$env:RUNNER_TEMP/xb" -A Win32
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/xb" --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir "$env:RUNNER_TEMP/xb" -C Release --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the AutoHotkey v2 reader
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip' -OutFile "$env:RUNNER_TEMP/ahk.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP/ahk.zip" -Algorithm SHA256).Hash -ne '4E0D0E65655066A646A210951320FEAEF0729A3597177131ADAEC4066BEF5869') { throw 'AHK archive hash mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/ahk.zip" "$env:RUNNER_TEMP/ahk"
          python -m pip install --disable-pip-version-check lupa==2.6
          ./tests/ahk_v2.ps1 -Interpreter "$env:RUNNER_TEMP/ahk/AutoHotkey32.exe"
      - name: Assemble personal patch
        shell: pwsh
        run: |
          $dest = 'dist/xivcrossbar'
          $files = @('xivcrossbar.lua','ffxi_directinput.ahk','controller_mappings.ahk','personal_controls.ahk','movement_signal.ahk','README.md','WORKFLOW.md','TESTING.md','libs/controller/personal_controls.lua','libs/controller/native_guard.lua','libs/controller/native_gamepad.lua')
          foreach ($file in $files) {
              $out = Join-Path $dest $file
              New-Item -ItemType Directory -Force (Split-Path $out) | Out-Null
              Copy-Item $file $out
          }
          New-Item -ItemType Directory -Force "$dest/native" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/xb/Release/xb_gamepad_messages.dll" "$dest/native/"
          Copy-Item "$env:RUNNER_TEMP/xb/_deps/minhook-src/LICENSE.txt" "$dest/native/MinHook-LICENSE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: XIVCrossbar-Personal-Native-${{ github.sha }}
          path: dist/
          if-no-files-found: error
