name: Public Beta AHK v2 verification
on:
  push:
    branches: [development/public-ahk-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        executable: [AutoHotkey64.exe, AutoHotkey32.exe]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned official AutoHotkey v2
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip' -OutFile "$env:RUNNER_TEMP\ahk.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\ahk.zip" -Algorithm SHA256).Hash -ne '4E0D0E65655066A646A210951320FEAEF0729A3597177131ADAEC4066BEF5869') { throw 'AHK archive hash mismatch' }
          Expand-Archive "$env:RUNNER_TEMP\ahk.zip" "$env:RUNNER_TEMP\ahk"
      - name: Verify native reader startup, profiles and lifecycle
        shell: pwsh
        run: ./tests/public_ahk_v2.ps1 -Interpreter "$env:RUNNER_TEMP\ahk\${{ matrix.executable }}"
  package:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y liblua5.4-0
      - run: python3 tests/run_lua.py tests/*.lua
      - run: python3 -m py_compile FFXI_Input.py
      - run: python3 packaging/beta1_make.py
      - uses: actions/upload-artifact@v4
        with:
          name: XIVCrossbar-Public-Beta-AHK-v2-Test
          path: dist/
          if-no-files-found: error
          retention-days: 30
